# File: tools/bochsrc.cfg
# Purpose: The Bochs machine this project is tested upon — the processor, the
#          memory, the medium the ISO is presented as, and the serial channel the
#          boot log is captured through.
# Key definitions: cpu, romimage, vgaromimage, ata0-master, com1.
# References:
#   - docs/project/TESTING.md: how this is run, what Bochs is good
#     for that QEMU and VirtualBox are not, and the build of the emulator it
#     requires.
#   - PROJECT_GUIDELINES.md, Section 2, the testing mandate: every milestone must
#     be bootable and testable.
#
# It is run from the repository root, because two paths below are relative to it:
#
#     bochs -q -f tools/bochsrc.cfg
#
# A boot takes some minutes — Bochs interprets every instruction rather than
# translating it — so this is a deliberate run and not a regression gate. The
# captured log is then read exactly as build/serial.log is.
#
# Why there is a file here at all, when Section 4A said for three sub-tasks that
# there could not be.
#
#   That section said a configuration naming absolute paths and a build of the
#   emulator this project does not produce would be a file that failed upon
#   somebody else's machine. The first half of that was solved rather than
#   endured: $BXSHARE is the variable Bochs itself uses to find its BIOS images,
#   so the two ROM lines below name no path belonging to any one machine, and the
#   medium and the captured log are relative to the repository root. The second
#   half stands — the emulator must still be built with the options Section 4A
#   records — and it is why this is a file rather than a `make` target: a target
#   would run whatever `bochs` is upon the PATH, which upon this machine has
#   three times been a build that cannot execute long mode at all.
#
# Why every value is stated rather than left to a default.
#
#   A default-built Bochs and one configured with --enable-x86-64 do not agree
#   upon what the default processor is, so a configuration that omitted `model`
#   would present a different machine depending upon which binary read it — and
#   the failure is that the kernel halts where it tries to enter long mode, with
#   nothing saying why. Everything here is named for that reason.

# The machine. 512 MiB is what `make run-qemu` and `make run-vbox` both give, so
# a difference between the three environments is not a difference in memory.
megs: 512

# Two processors, because the symmetric multi-processing of Phase 6 is asserted
# from the earliest opportunity and a single-processor run would skip four
# self-tests. `ips` is how many instructions Bochs pretends to execute per
# second; it decides how the emulated timers relate to the emulated processor,
# and 100 million is the value at which this kernel's local-APIC calibration
# against the interval timer produces a sane result.
#
# The model is named because it must be: a build without --enable-x86-64 offers
# nothing above `atom_n270`, every model in that list is 32-bit, and the symptom
# is a kernel that stops where it enables long mode.
cpu: count=2, ips=100000000, model=corei7_sandy_bridge_2600k

# The firmware, found through Bochs's own BXSHARE variable rather than an
# absolute path. If Bochs reports that it cannot open either of these, set
# BXSHARE to the directory holding them — /usr/local/share/bochs for a build
# installed from source.
#
# **The second line is not the first.** A `vgaromimage` pointed at the system
# BIOS produces a machine with no VBE, so GRUB cannot honour the Multiboot2
# framebuffer request and four self-tests fail in a way that looks exactly like a
# kernel regression. docs/project/TESTING.md records the symptom set
# and the half hour it cost.
romimage: file=$BXSHARE/BIOS-bochs-latest
vgaromimage: file=$BXSHARE/VGABIOS-lgpl-latest.bin

# The ISO, presented as an ATA CD-ROM upon the primary channel, which is where
# this kernel's ATA driver looks first. The path is relative to the repository
# root; run Bochs from there.
ata0: enabled=1, ioaddr1=0x1f0, ioaddr2=0x3f0, irq=14
ata0-master: type=cdrom, path=build/oxys.iso, status=inserted
boot: cdrom

# The diagnostic channel, captured to a file in build/ — which is ignored by git
# and removed by `make clean`, so a run leaves nothing behind that a commit could
# pick up. It is named apart from build/serial.log so that a Bochs run does not
# overwrite what `make verify` captured under QEMU.
com1: enabled=1, mode=file, dev=build/bochs-serial.log

# Headless, which requires the emulator to have been configured --with-nogui; a
# build without it reports `display library 'nogui' not available` and there is
# no headless run to be had.
display_library: nogui

# Bochs's own log — its architectural objections, which are the thing it is good
# for that the other two environments are not. It goes to a file rather than to
# the terminal so that it can be read after the run rather than watched during
# one, a boot taking minutes.
log: build/bochs.log

# And the emulator stops upon a panic rather than asking, there being nobody at
# a prompt in a headless run.
panic: action=fatal
