#
# File: boot/grub/grub.cfg
# Purpose: The GRUB configuration embedded within the Oxys-OS ISO image. It
#          defines the boot menu entries by which the kernel is loaded.
# References:
#   - GNU GRUB Manual, Section 6 ("Writing your own configuration file").
#   - GNU GRUB Manual, Section 16.3.16 ("multiboot2"): the multiboot2 command
#     loads an operating system image conforming to the Multiboot2 Specification.
#   - Multiboot2 Specification 2.0, Section 3.3: GRUB establishes the prescribed
#     machine state before transferring control to the image entry point.
#   - Multiboot2 Specification 2.0, Section 3.1.10: the framebuffer request tag,
#     which boot/boot.asm carries from sub-task 6.2.
#
# On the video mode, and why no entry below selects one.
#
# From sub-task 6.2 the image's Multiboot2 header carries the framebuffer
# request tag, and GRUB responds by setting a graphics mode and describing it in
# the framebuffer information tag. Which mode it sets is GRUB's decision and not
# this file's: `set gfxpayload=...` was tried in every entry, at both the top
# level and within, and GRUB 2.12 ignores it for a multiboot2 image. Asking for
# 1024x768x32 yielded 1280x800x32; asking for text yielded a graphics mode
# likewise. Loading video drivers explicitly with `insmod all_video` did change
# the outcome, to 800x600x24, but by changing which driver GRUB chose from and
# not by honouring anything asked of it — so it is not done here, the mode it
# produced being the poorer of the two.
#
# The kernel is therefore written to accept whatever it is handed and to assert
# what it was: see graphics/framebuffer.c and docs/design/GRAPHICS.md, Section 7.
# Directives that do not do what they appear to do are worse than none, so this
# file states the position and gives none.
#
# One consequence is visible to anyone who boots this ISO. Until sub-task 6.4
# supplies a console that can draw text upon a framebuffer, a graphics mode means
# the VGA text driver of sub-task 4.2 is writing to a buffer the adapter is no
# longer displaying: the screen shows the colour bands the framebuffer self-test
# paints, and nothing else. The boot log is carried by the serial port
# throughout, which is the path the tests read in any case.
#

# The interval, in seconds, for which the menu is presented before the default
# entry is selected automatically.
set timeout=3
set default=0

menuentry "Oxys-OS" {
    multiboot2 /boot/oxys.elf
    boot
}

menuentry "Oxys-OS (serial console diagnostics)" {
    # This entry is retained so that boot-time parameters may be introduced
    # without altering the ISO generation procedure.
    multiboot2 /boot/oxys.elf serial=com1
    boot
}

menuentry "Oxys-OS (disk write self-test)" {
    # The disk self-test reads unconditionally and writes only upon this
    # instruction. It writes a pattern to the final sector of the first disk,
    # reads it back and then restores the sector's previous contents; a
    # self-test that wrote to a disk unbidden would destroy the data of anybody
    # who booted this kernel upon their own machine. See docs/storage/DISK.md, Section 7.
    multiboot2 /boot/oxys.elf disk-write-test
    boot
}

menuentry "Oxys-OS (EXT2 write self-test)" {
    # The EXT2 code of Phase 5 writes only to the devices of memory it composes
    # for itself, and touches a volume upon a real disk only upon this
    # instruction. Even then it writes only to a regular file named
    # /oxys-write-test, which it does not create: a volume that does not already
    # hold one is left untouched. See docs/storage/EXT2.md, Section 14.10.
    #
    # This option also governs how the root volume is mounted. Without it, a
    # volume the machine carries is mounted read-only: a kernel that mounted a
    # stranger's disk for writing would mark it as not cleanly unmounted merely
    # by having been booted, and the disk would then demand a check before its
    # owner could mount it again. With it, the volume is mounted for writing,
    # the write test performed, and the volume then withdrawn and mounted afresh
    # read-only, so that it is left marked clean. See docs/storage/VFS.md,
    # Sections 8 and 8.1.
    multiboot2 /boot/oxys.elf ext2-write-test
    boot
}
