#
# File: boot/grub/grub.cfg
# Purpose: The GRUB configuration embedded within the Oxys-OS ISO image. It
#          defines the boot menu entries by which the kernel is loaded.
# References:
#   - GNU GRUB Manual, Section 6 ("Writing your own configuration file").
#   - GNU GRUB Manual, Section 16.3.16 ("multiboot2"): the multiboot2 command
#     loads an operating system image conforming to the Multiboot2 Specification.
#   - Multiboot2 Specification 2.0, Section 3.3: GRUB establishes the prescribed
#     machine state before transferring control to the image entry point.
#

# The interval, in seconds, for which the menu is presented before the default
# entry is selected automatically.
set timeout=3
set default=0

menuentry "Oxys-OS" {
    multiboot2 /boot/oxys.elf
    boot
}

menuentry "Oxys-OS (serial console diagnostics)" {
    # The kernel presently accepts no command line. This entry is retained so
    # that boot-time parameters may be introduced without altering the ISO
    # generation procedure.
    multiboot2 /boot/oxys.elf serial=com1
    boot
}
