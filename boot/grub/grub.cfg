#
# File: boot/grub/grub.cfg
# Purpose: The GRUB configuration embedded within the Oxys-OS ISO image. It
#          defines the boot menu entries by which the kernel is loaded.
# References:
#   - GNU GRUB Manual, Section 6 ("Writing your own configuration file").
#   - GNU GRUB Manual, Section 16.192 ("multiboot2"): the module that "provides
#     support for commands multiboot2 and module2 to load a multiboot kernel and
#     load a multiboot module, respectively". Both commands are used below.
#     **This citation was "Section 16.3.16" until sub-task 7.7**, which is the
#     numbering of an earlier edition; in the manual for GRUB 2.14, Chapter 16 is
#     Modules and Chapter 17 the list of available commands, and there is no
#     Section 16.3.16 of that name. The number was checked rather than copied
#     because a second citation was being added beside it.
#   - Multiboot2 Specification 2.0, Section 3.3: GRUB establishes the prescribed
#     machine state before transferring control to the image entry point.
#   - Multiboot2 Specification 2.0, Section 3.1.10: the framebuffer request tag,
#     which boot/boot.asm carries from sub-task 6.2.
#   - Multiboot2 Specification 2.0, Section 3.6.6: the module tag GRUB emits for
#     each module2 line, carrying the module's physical extent and the string the
#     rest of that line supplies.
#
# On the module every entry loads.
#
# From sub-task 7.7 each entry below loads /boot/initrd.img as a module named
# `initrd`. It is an EXT2 volume holding the utilities of sub-task 7.6 under
# /bin, and the kernel registers it as the block device `ram0` and mounts it at
# the root. See docs/storage/INITRD.md.
#
# **The name matters and the order does not.** The kernel finds the ramdisk by
# the string `initrd` and not by being the first module loaded, so a second
# module added here for some other purpose cannot be mistaken for it — which is
# the failure that would otherwise arrive as a filesystem that will not mount,
# with nothing to connect it to a line in this file.
#
# Every entry carries it, including the five that exist to select a diagnostic
# or to give the shell the screen.
# An entry without it would boot a kernel with no root filesystem, which is a
# difference nobody chose and which would be noticed only by whoever booted that
# entry.
#
# On the video mode, and why no entry below selects one.
#
# From sub-task 6.2 the image's Multiboot2 header carries the framebuffer
# request tag, and GRUB responds by setting a graphics mode and describing it in
# the framebuffer information tag. Which mode it sets is GRUB's decision and not
# this file's: `set gfxpayload=...` was tried in every entry, at both the top
# level and within, and GRUB 2.12 ignores it for a multiboot2 image. Asking for
# 1024x768x32 yielded 1280x800x32; asking for text yielded a graphics mode
# likewise. Loading video drivers explicitly with `insmod all_video` did change
# the outcome, to 800x600x24, but by changing which driver GRUB chose from and
# not by honouring anything asked of it — so it is not done here, the mode it
# produced being the poorer of the two.
#
# The kernel is therefore written to accept whatever it is handed and to assert
# what it was: see graphics/framebuffer.c and docs/design/FRAMEBUFFER.md.
# Directives that do not do what they appear to do are worse than none, so this
# file states the position and gives none.
#
# One consequence was visible to anyone who booted this ISO between sub-tasks 6.2
# and 6.4. A graphics mode means the VGA text driver of sub-task 4.2 is writing
# to a buffer the adapter is no longer displaying, so the screen showed the
# colour bands the framebuffer self-test paints and nothing else, and the boot
# log was carried by the serial port alone. Sub-task 6.4 ends that: the Shell
# Diagnostics entry below draws the log upon the framebuffer itself. See
# docs/design/CONSOLE.md.
#

# The interval, in seconds, for which the menu is presented before the default
# entry is selected automatically.
set timeout=3
set default=0

menuentry "Oxys-OS" {
    # Since sub-task 9.1 the default entry gives the screen, the keyboard and
    # the mouse to the window manager, and the shell runs upon the serial
    # line. The two entries below give the screen to the shell instead, as
    # every entry did through Phase 8. See kernel/kernel.c, where the choice
    # is made, and docs/design/WINDOWS.md.
    #
    # It is also the entry that shows the boot screen, since sub-task 9.3, and
    # the only one: it names no option at all, and the kernel asks for exactly
    # that — KernelDesktopEntry. A person who boots it sees a page and then a
    # desktop; the two below show a log or a prompt, which is what belongs
    # upon a screen the shell is about to take. docs/design/INIT.md.
    multiboot2 /boot/oxys.elf
    module2 /boot/initrd.img initrd
    boot
}

menuentry "Oxys-OS (Shell-only)" {
    # The shell upon the console, quiet: the banner, a prompt, and nothing
    # between, the boot log being upon the serial line. The pointer follows
    # the mouse and nothing uses it. This is what the default entry was until
    # sub-task 9.1, kept at the project owner's direction so that the shell
    # can be reached with no serial line attached.
    multiboot2 /boot/oxys.elf shell-only
    module2 /boot/initrd.img initrd
    boot
}

menuentry "Oxys-OS (Shell Diagnostics)" {
    # The shell upon the console after the boot log: from the parse of the
    # command line to the start of the shell, the screen shows some four
    # hundred lines of self-test verdicts and device reports written for
    # `make verify` and for a person diagnosing a boot, where the entries
    # above show nothing of them. The serial line carries the log in every
    # case; nothing about what the machine says of itself changes, only where
    # a person sees it. See kernel/kernel.c, KernelDisplaySetQuiet.
    #
    # Named "diagnostics" until sub-task 9.1, and renamed at the project
    # owner's direction when the Shell-only entry was added beside it, so that
    # the two entries that give the shell the screen read as a pair. The
    # option the kernel reads is still `diagnostics`. It replaced the "serial
    # console diagnostics" entry, whose `serial=com1` was read by nothing: the
    # serial adapter has been driven unconditionally since Phase 1, and an
    # option nothing reads is a promise nothing keeps.
    multiboot2 /boot/oxys.elf diagnostics
    module2 /boot/initrd.img initrd
    boot
}

menuentry "Oxys-OS (graphics figures)" {
    # The framebuffer and drawing self-tests of sub-tasks 6.2 and 6.3 paint a
    # figure upon the screen for a person to judge: colour bands whose order
    # proves the channel positions were read and not assumed, a panel whose
    # diagonals meet at its centre, a second panel clipped to its left half, and
    # a blitted copy. From sub-task 6.4 the console owns the screen and would
    # erase all of it within the same boot, so this entry draws the figure and
    # suppresses the console; every other entry does the reverse.
    #
    # The assertions of those self-tests run either way. It is only the drawing
    # that this governs. See docs/project/TESTING.md.
    multiboot2 /boot/oxys.elf graphics-figure
    module2 /boot/initrd.img initrd
    boot
}

menuentry "Oxys-OS (disk write self-test)" {
    # The disk self-test reads unconditionally and writes only upon this
    # instruction. It writes a pattern to the final sector of the first disk,
    # reads it back and then restores the sector's previous contents; a
    # self-test that wrote to a disk unbidden would destroy the data of anybody
    # who booted this kernel upon their own machine. See docs/storage/DISK.md.
    multiboot2 /boot/oxys.elf disk-write-test
    module2 /boot/initrd.img initrd
    boot
}

menuentry "Oxys-OS (EXT2 write self-test)" {
    # The EXT2 code of Phase 5 writes only to the devices of memory it composes
    # for itself, and touches a volume upon a real disk only upon this
    # instruction. Even then it writes only to a regular file named
    # /oxys-write-test, which it does not create: a volume that does not already
    # hold one is left untouched. See docs/storage/EXT2.md.
    #
    # This option also governs how the root volume is mounted. Without it, a
    # volume the machine carries is mounted read-only: a kernel that mounted a
    # stranger's disk for writing would mark it as not cleanly unmounted merely
    # by having been booted, and the disk would then demand a check before its
    # owner could mount it again. With it, the volume is mounted for writing,
    # the write test performed, and the volume then withdrawn and mounted afresh
    # read-only, so that it is left marked clean. See docs/storage/VFS.md.
    multiboot2 /boot/oxys.elf ext2-write-test
    module2 /boot/initrd.img initrd
    boot
}
