# The desktop's configuration, read by /bin/windows at start.
#
# Every key here has a default the program uses where the key is absent or its
# value is not one of the kind expected, so a file that is wrong in a line
# leaves the desktop looking as it did rather than not appearing.
#
# docs/design/CONFIG.md is the format.

[desktop]
# How large the windows and their contents are drawn. A scale of 0 means the
# program chooses from the screen it is given: two upon a screen at least 1024
# wide and one below that.
scale = 0

# The colour a window's content is drawn with, as three numbers from 0 to 255.
# The frame's colours are the window manager's and are not read from here.
accent = 79, 134, 247
