# The system configuration of Oxys-OS, read by /bin/init at start.
#
# One line at a time: `#` begins a comment, `[name]` opens a section, and
# `key = value` sets a key within it. A section repeated is a list, which is how
# the services below are written. A line that cannot be read costs that line and
# not the file; init reports what it could not read and starts what it could.
#
# docs/design/CONFIG.md is the format. docs/design/INIT.md is what init does
# with it.

[system]
# What init says of itself upon the serial line as it starts. Nothing else
# reads this yet; it is here because a configuration a person edits should
# visibly do something the first time they edit it.
banner = Oxys-OS is starting.

[service]
name    = desktop
run     = /bin/windows
# Started only where the window manager has the screen, which is the default
# boot entry. Upon the entries that give the shell the screen there is no
# display, and a service that needs one is not started at all rather than
# started and refused.
needs   = display
restart = always

# A service `init` starts and does not start again when it ends. Nothing here
# needs one yet, and the example is left commented so that the key is
# discoverable from the file a person already has open.
#
# [service]
# name    = once
# run     = /bin/echo
# restart = never
