# The session's configuration, read by /bin/session at start: how large the
# desktop is drawn, and what its launcher offers.
#
# docs/design/SESSION.md is what the session is. docs/design/CONFIG.md is the
# format: `#` begins a comment, `[name]` opens a section, `key = value` sets a
# key, and a section repeated is a list — which is how the entries below are
# written.

[session]
# How large the panel and the launcher are drawn. A scale of 0 means the
# session chooses from the screen it is given: two upon a screen at least 1024
# wide and one below that.
scale = 0

# The picture the desktop is covered with, scaled to cover the screen whatever
# its shape. A file in the format of libc/include/image.h; art/README.md holds
# the command that makes one. Remove the line for the mark upon plain ground.
background = /share/backgrounds/background.oxim

# Each `[launch]` block is one entry of the launcher, in the order written.
# `run` is the program; `name` is what the launcher shows, and is the program's
# path where it is absent.

[launch]
name = Windows
run  = /bin/windows

[launch]
name = Terminal
run  = /bin/terminal
# `icon` is a file, read once when the session starts. It is optional: an entry
# without one is offered without a picture, and an icon that cannot be read
# costs the picture and not the entry. docs/design/SESSION.md, Section 8.
icon = /share/icons/terminal.oxi

# `/bin/sh` is deliberately not offered, and `/bin/terminal` is what replaces
# it. It is worth saying why where somebody would otherwise add the shell back.
#
# A shell has no window. It reads the terminal the kernel assembles from the
# keyboard and the serial line, and upon this entry that terminal belongs to the
# shell the kernel itself started. A shell launched from here would claim the
# terminal in its own start-up — before it printed anything — so what a person
# saw upon the screen was nothing at all, while the shell they were typing at
# was stopped beneath them. Before 2026-09-21 it did worse and stopped the
# machine: docs/design/SHELL.md, Section 2.6.
#
# Since sub-task 9.6 the kernel refuses `tcgroup` to a process whose standard
# input is not the terminal, so a shell started anywhere else can no longer take
# it. `/bin/terminal` gives the shell a window, a pair of pipes and a person to
# type at it, which is what the entry was always meant to offer.
# docs/design/TERMINAL.md.

[launch]
name = Files
run  = /bin/files
