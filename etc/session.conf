# The session's configuration, read by /bin/session at start: how large the
# desktop is drawn, and what its launcher offers.
#
# docs/design/SESSION.md is what the session is. docs/design/CONFIG.md is the
# format: `#` begins a comment, `[name]` opens a section, `key = value` sets a
# key, and a section repeated is a list — which is how the entries below are
# written.

[session]
# How large the panel and the launcher are drawn. A scale of 0 means the
# session chooses from the screen it is given: two upon a screen at least 1024
# wide and one below that.
scale = 0

# Each `[launch]` block is one entry of the launcher, in the order written.
# `run` is the program; `name` is what the launcher shows, and is the program's
# path where it is absent.

[launch]
name = Windows
run  = /bin/windows

[launch]
name = Shell
run  = /bin/sh
