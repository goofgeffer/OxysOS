# The session's configuration, read by /bin/session at start: how large the
# desktop is drawn, and what its launcher offers.
#
# docs/design/SESSION.md is what the session is. docs/design/CONFIG.md is the
# format: `#` begins a comment, `[name]` opens a section, `key = value` sets a
# key, and a section repeated is a list — which is how the entries below are
# written.

[session]
# How large the panel and the launcher are drawn. A scale of 0 means the
# session chooses from the screen it is given: two upon a screen at least 1024
# wide and one below that.
scale = 0

# Each `[launch]` block is one entry of the launcher, in the order written.
# `run` is the program; `name` is what the launcher shows, and is the program's
# path where it is absent.

[launch]
name = Windows
run  = /bin/windows

# `/bin/sh` is deliberately not offered, and it is worth saying why where
# somebody would otherwise add it back.
#
# A shell has no window. It reads the terminal the kernel assembles from the
# keyboard and the serial line, and upon this entry that terminal belongs to the
# shell the kernel itself started. A shell launched from here claims the
# terminal in its own start-up — before it prints anything — so what a person
# sees upon the screen is nothing at all, while the shell they were typing at is
# stopped beneath them.
#
# Until 2026-09-21 it did worse than that: it stopped the machine. Two readers
# of one terminal each kept the other runnable, neither ever reached the halt
# that lets the timer tick poll the devices, and no byte arrived for either.
# That is fixed — docs/design/SHELL.md, Section 2.6 — and a shell started here
# now merely takes the terminal rather than freezing the machine with it. An
# entry that stops the shell a person is using is still a trap.
#
# Sub-task 9.6 gives the shell a terminal emulator of its own, and that is when
# this belongs here. docs/design/SESSION.md, Section 7.
